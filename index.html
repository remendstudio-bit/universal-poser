<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Universal Poser</title>


    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
        }
    }
    </script>



    <style>


        body {

            margin:0;

            overflow:hidden;

            background:#202020;

        }



        #visor3D {

            width:100vw;

            height:100vh;

            display:block;

        }



        #archivoGLB {

            position:fixed;

            top:10px;

            left:10px;

            z-index:10;

        }



        /* PRESENTACIÓN */

        #pantallaInicio {

            position:fixed;

            top:20px;

            left:20px;

            z-index:100;

            background:rgba(30,30,30,0.85);

            padding:15px 20px;

            border-radius:14px;

            color:white;

            backdrop-filter:blur(5px);

        }



        #pantallaInicio .logo {

            font-size:40px;

            text-align:center;

            margin-bottom:5px;

        }



        #pantallaInicio h1 {

            margin:0;

            font-size:24px;

            letter-spacing:2px;

        }



        #pantallaInicio p {

            margin:5px 0;

            font-size:15px;

            opacity:0.8;

        }



        #pantallaInicio span {

            font-size:13px;

            opacity:0.6;

        }



        #barraHerramientas {

            position:fixed;

            bottom:20px;

            left:20px;

            z-index:20;

            display:flex;

            flex-direction:column;

            gap:12px;

        }



        .botonHerramienta {

            width:55px;

            height:55px;

            border-radius:50%;

            border:none;

            background:#333;

            color:white;

            font-size:26px;

            cursor:pointer;

            display:flex;

            align-items:center;

            justify-content:center;

            user-select:none;

            -webkit-user-select:none;

        }



        .botonHerramienta:active {

            transform:scale(0.9);

        }



    </style>


</head>



<body>



<!-- PRESENTACIÓN -->

<div id="pantallaInicio">


    <div class="logo">

        🐊

    </div>


    <h1>

        UNIVERSAL POSER

    </h1>


    <p>

        3D Character Posing Tool

    </p>


    <span>

        Version 1.0<br>

        by Alejandro Yont

    </span>


</div>




<input 
type="file"
id="archivoGLB"
accept=".glb,.gltf">



<div id="barraHerramientas">


<button class="botonHerramienta" id="botonCamara">🔒</button>


<button class="botonHerramienta" id="botonMover">✥</button>


<button class="botonHerramienta" id="botonDeshacer">↩️</button>


<button class="botonHerramienta" id="botonReset">🔄</button>


<button class="botonHerramienta" id="botonEliminar">🗑️</button>


</div>



<canvas id="visor3D"></canvas>



<script 
type="module" 
src="./script.js">
</script>


</body>


</html>
