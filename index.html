<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Orvack Poser</title>


    <style>

        body {

            margin: 0;

            overflow: hidden;

            background: #202020;

        }


        #visor3D {

            width: 100vw;

            height: 100vh;

            display: block;

        }


        #archivoGLB {

            position: fixed;

            top: 10px;

            left: 10px;

            z-index: 10;

        }

    </style>


</head>


<body>


<input 
type="file"
id="archivoGLB"
accept=".glb,.gltf">



<canvas id="visor3D"></canvas>



<script 
type="module" 
src="./script.js">
</script>



</body>


</html>
