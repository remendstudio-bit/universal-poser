<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Universal Poser</title>


    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
        }
    }
    </script>



    <style>


        body {

            margin:0;

            overflow:hidden;

            background:#202020;

        }



        #visor3D {

            width:100vw;

            height:100vh;

            display:block;

        }



        #archivoGLB {

            position:fixed;

            top:10px;

            left:10px;

            z-index:10;

        }



        /* PANTALLA INICIAL */

        #pantallaInicio {

            position:fixed;

            top:0;

            left:0;

            width:100%;

            height:100%;

            background:#202020;

            z-index:100;

            display:flex;

            flex-direction:column;

            align-items:center;

            justify-content:center;

            color:white;

        }



        #pantallaInicio h1 {

            font-size:42px;

            margin:0;

            letter-spacing:3px;

        }



        #pantallaInicio p {

            font-size:18px;

            opacity:0.8;

        }



        #botonInicio {

            margin-top:30px;

            width:150px;

            height:50px;

            border:none;

            border-radius:25px;

            background:#333;

            color:white;

            font-size:20px;

            cursor:pointer;

        }



        #pantallaInicio span {

            margin-top:40px;

            text-align:center;

            opacity:0.6;

        }



        #barraHerramientas {

            position:fixed;

            bottom:20px;

            left:20px;

            z-index:20;

            display:flex;

            flex-direction:column;

            gap:12px;

        }



        .botonHerramienta {

            width:55px;

            height:55px;

            border-radius:50%;

            border:none;

            background:#333;

            color:white;

            font-size:26px;

            cursor:pointer;

            display:flex;

            align-items:center;

            justify-content:center;

            user-select:none;

            -webkit-user-select:none;

        }



        .botonHerramienta:active {

            transform:scale(0.9);

        }



    </style>


</head>



<body>



<!-- PRESENTACIÓN -->

<div id="pantallaInicio">


    <h1>
        UNIVERSAL POSER
    </h1>


    <p>
        3D Character Posing Tool
    </p>


    <button id="botonInicio">

        ▶ Iniciar

    </button>


    <span>

        Version 1.0<br>

        by Alejandro Yont

    </span>


</div>




<input 
type="file"
id="archivoGLB"
accept=".glb,.gltf">



<div id="barraHerramientas">


<button class="botonHerramienta" id="botonCamara">🔒</button>


<button class="botonHerramienta" id="botonMover">✥</button>


<button class="botonHerramienta" id="botonDeshacer">↩️</button>


<button class="botonHerramienta" id="botonReset">🔄</button>


<button class="botonHerramienta" id="botonEliminar">🗑️</button>


</div>



<canvas id="visor3D"></canvas>



<script 
type="module" 
src="./script.js">
</script>


</body>


</html>
