<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Orvack Poser</title>


    <!-- IMPORTMAP PARA THREE.JS -->

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
        }
    }
    </script>



    <style>

        body {

            margin: 0;

            overflow: hidden;

            background: #202020;

        }


        #visor3D {

            width: 100vw;

            height: 100vh;

            display: block;

        }


        #archivoGLB {

            position: fixed;

            top: 10px;

            left: 10px;

            z-index: 10;

        }



        #botonCamara {

            position: fixed;

            bottom: 20px;

            left: 20px;

            z-index: 20;


            padding: 12px 18px;

            border-radius: 10px;

            border: none;


            background: #333;

            color:white;


            font-size:16px;


            cursor:pointer;

        }


        #botonCamara:active{

            transform:scale(0.95);

        }


    </style>


</head>



<body>


<input 
type="file"
id="archivoGLB"
accept=".glb,.gltf">



<button id="botonCamara">

🔒 Bloquear cámara

</button>



<canvas id="visor3D"></canvas>



<script 
type="module" 
src="./script.js">
</script>



</body>


</html>
