<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Orvack Poser</title>


    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
        }
    }
    </script>



    <style>


        body {

            margin:0;

            overflow:hidden;

            background:#202020;

        }



        #visor3D {

            width:100vw;

            height:100vh;

            display:block;

        }



        #archivoGLB {

            position:fixed;

            top:10px;

            left:10px;

            z-index:10;

        }



        #barraHerramientas {

            position:fixed;

            bottom:20px;

            left:20px;

            z-index:20;

            display:flex;

            flex-direction:column;

            gap:12px;

        }



        .botonHerramienta {

            width:55px;

            height:55px;

            border-radius:50%;

            border:none;

            background:#333;

            color:white;

            font-size:26px;

            cursor:pointer;

            display:flex;

            align-items:center;

            justify-content:center;

            user-select:none;

            -webkit-user-select:none;

        }



        .botonHerramienta:active {

            transform:scale(0.9);

        }



    </style>


</head>



<body>


<input 
type="file"
id="archivoGLB"
accept=".glb,.gltf">



<div id="barraHerramientas">


<button class="botonHerramienta" id="botonCamara">🔒</button>


<button class="botonHerramienta" id="botonMover">✥</button>


<button class="botonHerramienta" id="botonDeshacer">↩️</button>


<button class="botonHerramienta" id="botonReset">🔄</button>


<button class="botonHerramienta" id="botonEliminar">🗑️</button>


</div>



<canvas id="visor3D"></canvas>



<script 
type="module" 
src="./script.js">
</script>


</body>


</html>
